<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Multiplicación de Matrices</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script defer src="script.js"></script>
</head>
<body>
    <div class="container">
        <h1>Multiplicación de Matrices</h1>
    
        <div class="input-group">
            <label for="filas1">Filas Matriz 1:</label>
            <input id="filas1" type="number">
        </div>
    
        <div class="input-group">
            <label for="columnas1">Columnas Matriz 1:</label>
            <input id="columnas1" type="number">
        </div>
    
        <div class="input-group">
            <label for="filas2">Filas Matriz 2:</label>
            <input id="filas2" type="number">
        </div>
    
        <div class="input-group">
            <label for="columnas2">Columnas Matriz 2:</label>
            <input id="columnas2" type="number">
        </div>
    
        <p style="font-size: 14px;">Las matrices se generarán automáticamente con valores aleatorios. Asegúrate de que el número de columnas de la Matriz 1 sea igual al número de filas de la Matriz 2.</p>
    
        <button onclick="createMatrixInputs()">Generar Matrices</button>
        <button onclick="multiplyMatrices()">Multiplicar</button>

        <div id="matrices"></div>
        <div id="result"></div>
    </div>
</body>
</html>
