<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Multiplicación de Matrices</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script defer src="script.js"></script>
</head>
<body>
    <h1>Multiplicación de Matrices</h1>

    <form id="matrix-form">
        <label for="rows1">Filas Matriz 1:</label>
        <input type="number" id="rows1" min="1" required>

        <label for="cols1">Columnas Matriz 1:</label>
        <input type="number" id="cols1" min="1" required>

        <label for="rows2">Filas Matriz 2:</label>
        <input type="number" id="rows2" min="1" required>

        <label for="cols2">Columnas Matriz 2:</label>
        <input type="number" id="cols2" min="1" required>

        <p>
            Las matrices se generarán automáticamente con valores aleatorios. Asegúrate de que el número de columnas de la Matriz 1 sea igual al número de filas de la Matriz 2.
        </p>

        <button type="button" onclick="createMatrixInputs()">Generar Matrices</button>
        <button type="button" onclick="multiplyMatrices()">Multiplicar</button>
    </form>

    <div id="matrices"></div>
    <div id="result"></div>
</body>
</html>
